
name: Build STARFALL APK

on:
  workflow_dispatch:
  push:
    branches:
      - upload-starfallv2
    paths:
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'assets/**'
      - 'css/**'
      - 'js/**'
      - 'STARFALL_APK_LOGO.png'

permissions:
  contents: read

jobs:
  build:
    name: Build STARFALL Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web files and Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp -r assets css js www/

          cat > package.json <<'EOF'
          {
            "name": "starfall",
            "version": "1.0.0",
            "private": true,
            "description": "STARFALL Android app",
            "scripts": {},
            "dependencies": {
              "@capacitor/core": "^7.0.0",
              "@capacitor/android": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0",
              "@capacitor/assets": "^3.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.starfall.game",
            "appName": "STARFALL",
            "webDir": "www"
          }
          EOF

          npm install

      - name: Prepare app icon
        run: |
          test -f STARFALL_APK_LOGO.png
          mkdir -p resources
          sudo apt-get update
          sudo apt-get install -y imagemagick
          magick STARFALL_APK_LOGO.png \
            -resize 1024x1024 \
            -background "#101018" \
            -gravity center \
            -extent 1024x1024 \
            resources/icon.png

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare STARFALL.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            STARFALL.apk

      - name: Upload STARFALL APK
        uses: actions/upload-artifact@v4
        with:
          name: STARFALL-APK
          path: STARFALL.apk
          if-no-files-found: error
          retention-days: 7
