```yaml
name: Build STARFALL APK

on:
  workflow_dispatch:
  push:
    branches:
      - upload-starfallv2
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build STARFALL Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout STARFALL
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web Game
        run: npm run build --if-present

      - name: Sync Android Project
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare STARFALL APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/STARFALL.apk

      - name: Upload STARFALL APK
        uses: actions/upload-artifact@v4
        with:
          name: STARFALL-APK
          path: release/STARFALL.apk
          if-no-files-found: error
          retention-days: 14
```
